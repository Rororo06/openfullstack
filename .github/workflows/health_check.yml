name: Periodic health check

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check that the app answers
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://blogilista-vgy5.onrender.com/health
          max-attempts: 3
          retry-delay: 10s
      - name: Report downtime
        if: failure()
        uses: rjstone/discord-webhook-notify@v1
        with:
          severity: error
          text: Health check failed
          description: https://blogilista-vgy5.onrender.com/health did not answer
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}
